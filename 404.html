<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Stackly Pharmacy</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="assets/top-logo.webp" type="image/webp"/>
  </head>
  <body>
    <!-- NAVBAR -->
    <header class="navbar" id="navbar">
      <div class="container navbar__inner">
        <a href="index.html" class="navbar__logo"
          ><img src="assets/logo.webp" alt="Stackly"
        /></a>
        <div class="navbar__actions">
          <a href="index.html" class="btn btn-primary btn-sm"
            ><i class="fa-solid fa-house"></i> Go Home</a
          >
        </div>
      </div>
    </header>

    <div class="page-404">
      <div style="position: relative; z-index: 2; text-align: center">
        <div class="page-404-num" data-reveal="scale">404</div>
        <h1 class="page-404-title" data-reveal="fade-up">
          Oops! Page Not Found.
        </h1>
        <p class="page-404-desc" data-reveal="fade-up" data-reveal-delay="100">
          The page you're looking for has been moved, renamed, or doesn't exist
          yet. But don't worry — there's plenty more to explore!
        </p>
        <div
          class="d-flex gap-3 justify-content-center flex-wrap"
          data-reveal="fade-up"
          data-reveal-delay="200"
        >
          <a href="index.html" class="btn btn-primary btn-lg"
            ><i class="fa-solid fa-home"></i> Back to Home</a
          >
          <a
            href="store.html"
            class="btn btn-lg"
            style="
              background: rgba(255, 255, 255, 0.1);
              border: 1px solid rgba(255, 255, 255, 0.2);
              color: #fff;
              backdrop-filter: blur(8px);
            "
          >
            <i class="fa-solid fa-store"></i> Browse Store
          </a>
        </div>
        <div
          style="
            margin-top: 3rem;
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
          "
        >
          <a
            href="about.html"
            style="
              color: rgba(255, 255, 255, 0.5);
              font-size: 0.85rem;
              text-decoration: underline;
              text-underline-offset: 3px;
            "
            >About Us</a
          >
          <a
            href="contact.html"
            style="
              color: rgba(255, 255, 255, 0.5);
              font-size: 0.85rem;
              text-decoration: underline;
              text-underline-offset: 3px;
            "
            >Contact Support</a
          >
          <a
            href="blog.html"
            style="
              color: rgba(255, 255, 255, 0.5);
              font-size: 0.85rem;
              text-decoration: underline;
              text-underline-offset: 3px;
            "
            >Health Blog</a
          >
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Navbar init
      document.getElementById("navbar").classList.add("scrolled");
      // Scroll reveal
      const revealEls = document.querySelectorAll("[data-reveal]");
      const observer = new IntersectionObserver(
        (entries) =>
          entries.forEach((en) => {
            if (en.isIntersecting) {
              en.target.classList.add("revealed");
              observer.unobserve(en.target);
            }
          }),
        { threshold: 0.1 },
      );
      revealEls.forEach((el) => observer.observe(el));
      // Auto-reveal for 404 (it's all visible)
      setTimeout(
        () => revealEls.forEach((el) => el.classList.add("revealed")),
        100,
      );
    </script>
  </body>
</html>
