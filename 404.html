<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Stackly Pharmacy</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="assets/top-logo.webp">
  </head>
  <body>

    <header class="navbar" id="navbar">
      <div class="container navbar__inner">
        <a href="index.html" class="navbar__logo"
          ><img src="assets/logo.webp" alt="Stackly"
        /></a>
        <div class="navbar__actions">
          <a href="index.html" class="btn btn-primary btn-sm"
            ><i class="fa-solid fa-house"></i> Go Home</a
          >
        </div>
      </div>
    </header>

    <div class="page-404">
      <div style="position: relative; z-index: 2; text-align: center">
        <div class="page-404__num" data-reveal="scale">404</div>
        <h1 class="page-404__title" data-reveal="fade-up">
          Oops! Page Not Found.
        </h1>
        <p class="page-404__desc" data-reveal="fade-up" data-reveal-delay="100">
          The page you're looking for has been moved, renamed, or doesn't exist
          yet. But don't worry there's plenty more to explore!
        </p>
        <div
          class="d-flex gap-3 justify-content-center flex-wrap"
          data-reveal="fade-up"
          data-reveal-delay="200"
        >
          <a href="index.html" class="btn btn-primary btn-lg"
            ><i class="fa-solid fa-home"></i> Back to Home</a
          >
          <a
            href="javascript:history.back()"
            class="btn btn-lg"
            style="
              background: rgba(255, 255, 255, 0.1);
              border: 1px solid rgba(255, 255, 255, 0.2);
              color: #fff;
              backdrop-filter: blur(8px);
            "
          >
            <i class="fa-solid fa-arrow-left"></i> Go Back
          </a>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (typeof AOS !== 'undefined') {
          AOS.init({ duration: 700, once: true, offset: 60, easing: 'ease-out-cubic' });
        }

        const navbar = document.getElementById('navbar');
        if (navbar) {
          const onScroll = () => {
            if (window.scrollY > 50) {
              navbar.classList.add('scrolled');
              navbar.classList.remove('navbar--hero');
            } else {
              navbar.classList.remove('scrolled');
              navbar.classList.add('navbar--hero');
            }
          };
          window.addEventListener('scroll', onScroll, { passive: true });
          onScroll();
        }

        const hamburger = document.getElementById('hamburger');
        const mobileOverlay = document.getElementById('mobileOverlay');
        if (hamburger && mobileOverlay) {
          hamburger.addEventListener('click', () => {
            const isOpen = mobileOverlay.classList.contains('is-open');
            if (isOpen) {
              closeMobileMenu();
            } else {
              mobileOverlay.classList.add('is-open');
              hamburger.classList.add('is-open');
              hamburger.setAttribute('aria-expanded', 'true');
              document.body.style.overflow = 'hidden';
              document.documentElement.style.overflow = 'hidden';
            }
          });
        }

        document.addEventListener('keydown', e => {
          if (e.key === 'Escape') {
            closeMobileMenu();
            closeSearch();
          }
        });

        window.addEventListener('resize', () => {
          if (window.innerWidth >= 992) {
            closeMobileMenu();
          }
        });

        const searchOverlay = document.getElementById('searchOverlay');
        const searchToggle  = document.getElementById('searchToggle');
        const searchClose   = document.getElementById('searchClose');
        const searchInput   = document.getElementById('searchInput');
        if (searchToggle && searchOverlay && searchClose && searchInput) {
          searchToggle.addEventListener('click', () => {
            searchOverlay.classList.add('is-open');
            document.body.style.overflow = 'hidden';
            document.documentElement.style.overflow = 'hidden';
            setTimeout(() => searchInput.focus(), 300);
          });
          searchClose.addEventListener('click', closeSearch);
          searchOverlay.addEventListener('click', e => {
            if (e.target === searchOverlay) closeSearch();
          });
          searchInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
              closeSearch();
              window.location.href = 'store.html';
            }
          });
        }
      });

      function closeMobileMenu() {
        const mobileOverlay = document.getElementById('mobileOverlay');
        const hamburger = document.getElementById('hamburger');
        if (mobileOverlay) mobileOverlay.classList.remove('is-open');
        if (hamburger) {
          hamburger.classList.remove('is-open');
          hamburger.setAttribute('aria-expanded', 'false');
        }
        document.body.style.overflow = '';
        document.documentElement.style.overflow = '';
      }

      function closeSearch() {
        const searchOverlay = document.getElementById('searchOverlay');
        if (searchOverlay) searchOverlay.classList.remove('is-open');
        document.body.style.overflow = '';
        document.documentElement.style.overflow = '';
      }

      function showToast(msg, icon = 'fa-circle-check') {
        const container = document.getElementById('toastContainer');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<i class="fa-solid ${icon}"></i>${msg}`;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(16px)';
          toast.style.transition = 'all 0.35s';
          setTimeout(() => toast.remove(), 400);
        }, 3500);
      }

      function handleNewsletter(e) {
        e.preventDefault();
        window.location.href = '404.html';
      }
    </script>
    <script>
      document.getElementById("navbar").classList.add("scrolled");
      const revealEls = document.querySelectorAll("[data-reveal]");
      const observer = new IntersectionObserver(
        (entries) =>
          entries.forEach((en) => {
            if (en.isIntersecting) {
              en.target.classList.add("revealed");
              observer.unobserve(en.target);
            }
          }),
        { threshold: 0.1 },
      );
      revealEls.forEach((el) => observer.observe(el));
      setTimeout(
        () => revealEls.forEach((el) => el.classList.add("revealed")),
        100,
      );
    </script>
  </body>
</html>
